name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - '[0-9]+.x'
  schedule:
    - cron: '0 0 * * *'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.0', 8.1, 8.2, 8.3, 8.4, 8.5]
        stability: [lowest, highest]

    name: PHP ${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Setup problem matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - if: matrix.php >= '8.1'
        name: Require packages for PHP greater than 8.1
        run: composer require orchestra/testbench:'^6.23 || ^7.0 || ^8.0 || ^9.0 || ^10.0 || ^11.0' ramsey/collection:'^1.2 || ^2.0' --no-update --dev

      - if: matrix.php >= '8.2'
        name: Require packages for PHP greater than 8.2
        run: composer require nesbot/carbon:'^2.62.1 || ^3.4' --no-update --dev

      - if: matrix.php >= '8.4'
        name: Require packages for PHP greater than 8.4
        run: composer require orchestra/testbench:'^9.6 || ^10.0 || ^11.0' laravel/framework:'^10.48.25 || ^11.34.0 || ^12.0 || ^13.0' graham-campbell/manager:'^5.1.1' --no-update --dev

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.stability }}

      - name: Execute tests
        run: composer run-script test:phpunit -- --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Code Climate
        uses: paambaati/codeclimate-action@v9.0.0
        continue-on-error: true
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
        with:
          coverageCommand: ls
          coverageLocations: ${{github.workspace}}/coverage.xml:clover
